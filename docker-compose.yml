services:
  clk-landing:
    build: .
    container_name: clk-landing
    restart: always
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      VITE_AUTH_ENABLED: "false"
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
    ports:
      - "127.0.0.1:3010:3000"
